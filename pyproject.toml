[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "celltype-audit"
version = "0.1.0"
description = "Audit single-cell atlas cell-type annotations against the Cell Ontology and expression evidence"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Narendra Meena"}]
keywords = ["single-cell", "cell ontology", "annotation", "quality control", "CELLxGENE"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["numpy>=1.21", "h5py>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
celltype-audit = "celltype_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
