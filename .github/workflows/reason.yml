name: reason

# Re-runs V4-V8 -- the checks that need a reasoner -- against the CURRENT Cell Ontology
# release, not the one pinned when a proposal was drafted. A verdict recorded months ago
# can quietly stop being true when CL moves; this fails the build when that happens instead
# of letting the page keep serving a stale green badge.
#
# Weekly rather than on every push: the ontology changes on CL's schedule, not ours.

on:
  schedule:
    - cron: "17 6 * * 1"          # Mondays, 06:17 UTC
  push:
    paths:
      - "docs/proposals.json"
      - "analysis/reason_checks.py"
      - ".github/workflows/reason.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reason
  cancel-in-progress: false

jobs:
  entailments:
    name: ELK entailment checks against the current CL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch ROBOT
        run: |
          curl -sSL -o robot.jar \
            https://github.com/ontodev/robot/releases/latest/download/robot.jar
          java -jar robot.jar --version

      - name: Fetch the current Cell Ontology
        run: |
          curl -sSL -o cl-base.owl http://purl.obolibrary.org/obo/cl/cl-base.owl
          ls -l cl-base.owl
          # record which release we are judging against, so a failure is interpretable
          grep -m1 -o 'versionIRI[^>]*>' cl-base.owl || true

      - name: Recompute V4-V8 and compare with the committed verdicts
        env:
          CL_OWL: cl-base.owl
          ROBOT_JAR: robot.jar
          JAVA_XMX: 5g          # GitHub runners have ~7 GB; leave headroom
        run: python3 analysis/reason_checks.py --check

      - name: Explain a failure
        if: failure()
        run: |
          echo "A recorded verdict no longer holds against the current CL release, or an"
          echo "entailment check could not run. Neither is a build problem: it is the"
          echo "ontology having moved. Re-run analysis/reason_checks.py locally, review the"
          echo "change, and commit the updated docs/proposals.json."
