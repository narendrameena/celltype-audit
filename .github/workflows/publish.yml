name: publish

# Publishing is triggered by a version tag, so a release is always a deliberate
# act tied to a specific commit -- never a side effect of a push to main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refuse to publish if the tag and the package version disagree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG  pyproject=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag v$TAG does not match version $VER"; exit 1; }

      - name: Tests must pass before anything is published
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          pytest -q

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # No `environment:` on purpose. PyPI matches the OIDC `sub` claim exactly, and an
    # environment must therefore be set in BOTH the workflow and the trusted publisher or
    # in NEITHER -- a mismatch in either direction fails as `invalid-publisher`. The field
    # is optional on PyPI's form and commonly left blank, so the no-environment form is the
    # one more likely to match a publisher someone has just registered. To use one, add
    # `environment: pypi` back here AND type `pypi` into the publisher's Environment field.
    # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so no API
    # token is stored anywhere. Configure once at
    # https://pypi.org/manage/account/publishing/
    permissions:
      id-token: write
    env:
      # `secrets` cannot be referenced from a step-level `if:` -- doing so is a workflow
      # validation error, which GitHub reports as a run with zero jobs rather than as a
      # syntax error. Resolving it once here, where the secrets context IS allowed, gives
      # the steps a plain string to test.
      HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Two routes, and the repository picks whichever is set up. Trusted Publishing is
      # preferred and needs no secret at all; the token path exists because a project whose
      # first release was uploaded by hand has no publisher registered, and configuring one
      # is a manual step on PyPI that a release should not be blocked on.
      - name: Upload (API token)
        if: env.HAS_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Upload (Trusted Publishing)
        if: env.HAS_TOKEN != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      # The usual reason this step fails is that PyPI has no trusted publisher for the
      # project -- which is the state any project starts in if its first release was
      # uploaded with an API token. Nothing is wrong with the build when that happens:
      # the version check, the tests and `twine check` all ran in the job before this one.
      - name: Explain a failed upload
        if: failure()
        run: |
          echo "The distributions built and validated; the upload was rejected."
          echo
          echo "If this is the first Trusted Publishing release, register the publisher at"
          echo "  https://pypi.org/manage/project/celltype-audit/settings/publishing/"
          echo "with EXACTLY these values -- all four must match or the OIDC token is refused:"
          echo "  owner            : ${{ github.repository_owner }}"
          echo "  repository       : ${{ github.event.repository.name }}"
          echo "  workflow         : publish.yml"
          echo "  environment      : (leave BLANK -- this workflow declares none)"
          echo
          echo "Then re-run this job. No API token needs to be created or stored: that is"
          echo "the point of Trusted Publishing, and a token that has been pasted anywhere"
          echo "should be revoked rather than reused."
          exit 1
