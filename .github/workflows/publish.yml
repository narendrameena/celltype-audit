name: publish

# Publishing is triggered by a version tag, so a release is always a deliberate
# act tied to a specific commit -- never a side effect of a push to main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refuse to publish if the tag and the package version disagree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG  pyproject=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag v$TAG does not match version $VER"; exit 1; }

      - name: Tests must pass before anything is published
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          pytest -q

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so no API
    # token is stored anywhere. Configure once at
    # https://pypi.org/manage/account/publishing/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
